
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Arcade — Daily Puzzle</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./">brain arcade<span>.</span></a>

    <div class="timer" aria-label="Time elapsed">
      <span>TIME</span>
      <strong id="timer">00:00</strong>
    </div>
  </header>

  <main class="game-panel">

    <div class="level-row" id="levelRow">
      <span>DAILY CHALLENGE</span>
      <span>1 PUZZLE</span>
    </div>

    <div class="progress-track" id="progressTrack">
      <div id="progressBar"></div>
    </div>

    <!-- Welcome screen -->
    <section id="welcomeScreen" class="welcome-screen">
      <p class="category">YOUR DAILY BRAIN TEASER</p>

      <h1>Ready to challenge your mind?</h1>

      <p class="instruction">
        One puzzle. Three attempts. How quickly can you solve it?
      </p>

      <button id="startButton" type="button">
        Start today's puzzle
      </button>
    </section>

    <!-- Puzzle and completion screen -->
    <section id="gameContent" hidden>
      <div id="challengeIcon" class="challenge-icon"></div>

      <p id="category" class="category"></p>

      <p id="completionTime" class="completion-time" hidden></p>

      <p id="completionMessage" class="completion-message" hidden></p>
      
      <h1 id="question"></h1>

      <p id="instruction" class="instruction"></p>

      
    </section>

    <!-- Answer feedback -->
    <p id="feedback" class="feedback" role="status"
       aria-live="polite" hidden></p>

    <!-- Answer form -->
    <form id="answerForm" class="answer-form" hidden>
      <label for="answerInput">YOUR ANSWER</label>

      <input
        id="answerInput"
        type="text"
        placeholder="Type your answer..."
        autocomplete="off"
        spellcheck="false"
        maxlength="100"
        required
      >

      <p id="attemptsText" class="attempts-text">
        3 attempts remaining
      </p>

      <button id="submitButton" type="submit">
        Submit answer
      </button>
    </form>

    <!-- Hints -->
    <div id="hintArea" class="hint-area" hidden>
      <button id="hintButton" class="text-button" type="button">
        Need a hint?
      </button>

      <p id="hintText" class="hint-text" aria-live="polite"></p>
    </div>

    <!-- Solution -->
    <section id="explanation" class="explanation" hidden>
      <p class="explanation-eyebrow">THE SOLUTION</p>

      <h2>Here's why</h2>

      <p id="answerText" class="answer-reveal"></p>

      <p id="explanationText"></p>
    </section>

  </main>

  <footer class="footer">
    A little challenge for your mind.
  </footer>
</body>
</html>
